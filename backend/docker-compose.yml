services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      MYSQL_DATABASE: ${DB_DATABASE:-smartbin}
      MYSQL_USER: ${DB_USERNAME:-smartbin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - smartbin_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=tcp -h 127.0.0.1 -u root --silent -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api/v1}
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in backend/.env}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      CARD_HMAC_SECRET: ${CARD_HMAC_SECRET:?Set CARD_HMAC_SECRET in backend/.env}
      NIK_HMAC_SECRET: ${NIK_HMAC_SECRET:?Set NIK_HMAC_SECRET in backend/.env}
      MACHINE_API_KEY: ${MACHINE_API_KEY:?Set MACHINE_API_KEY in backend/.env}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-smartbin}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      DB_DATABASE: ${DB_DATABASE:-smartbin}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  smartbin_mysql_data:
