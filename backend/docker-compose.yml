services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      MYSQL_DATABASE: ${DB_DATABASE:-smartbin}
      MYSQL_USER: ${DB_USERNAME:-smartbin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - smartbin_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=tcp -h 127.0.0.1 -u root --silent -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api/v1}
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in backend/.env}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      CARD_HMAC_SECRET: ${CARD_HMAC_SECRET:?Set CARD_HMAC_SECRET in backend/.env}
      NIK_HMAC_SECRET: ${NIK_HMAC_SECRET:?Set NIK_HMAC_SECRET in backend/.env}
      MACHINE_API_KEY: ${MACHINE_API_KEY:?Set MACHINE_API_KEY in backend/.env}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-smartbin}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      DB_DATABASE: ${DB_DATABASE:-smartbin}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      MONGO_URI: mongodb://${MONGO_USERNAME:-smartbin}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-smartbin_realtime}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-smartbin_realtime}
      MONGO_TELEMETRY_TTL_SECONDS: ${MONGO_TELEMETRY_TTL_SECONDS:-7776000}
      MQTT_URL: ${MQTT_URL:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-smartbin-api}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_SUBSCRIBE_TOPIC: ${MQTT_SUBSCRIBE_TOPIC:-smartbin/+/telemetry/#}
      MQTT_DEVICE_MACHINE_MAP: ${MQTT_DEVICE_MACHINE_MAP:-esp1=bin-01,esp2=bin-02}
      CAPTURE_STORAGE_DIR: ${CAPTURE_STORAGE_DIR:-/var/lib/smartbin/captures}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - smartbin_captures:/var/lib/smartbin/captures
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-smartbin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in backend/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-smartbin_realtime}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - smartbin_mongodb_data:/data/db
      - smartbin_mongodb_config:/data/configdb
    command: ["mongod", "--bind_ip_all", "--quiet"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  smartbin_mysql_data:
  smartbin_mongodb_data:
  smartbin_mongodb_config:
  smartbin_captures:
