services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      MYSQL_DATABASE: ${DB_DATABASE:-smartbin}
      MYSQL_USER: ${DB_USERNAME:-smartbin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - smartbin_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=tcp -h 127.0.0.1 -u root --silent -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ${API_LOG_DIR:-./logs}:/var/log/smartbin
      - smartbin_captures:/var/lib/smartbin/captures
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-smartbin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in backend/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-smartbin_realtime}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - smartbin_mongodb_data:/data/db
      - smartbin_mongodb_config:/data/configdb
    command: ["mongod", "--bind_ip_all", "--quiet"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  smartbin_mysql_data:
  smartbin_mongodb_data:
  smartbin_mongodb_config:
  smartbin_captures:
