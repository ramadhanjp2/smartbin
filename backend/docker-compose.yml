services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${DB_DATABASE:-smartbin}
      MYSQL_USER: ${DB_USERNAME:-smartbin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smartbin}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - smartbin_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  smartbin_mysql:
